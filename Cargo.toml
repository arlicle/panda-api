[workspace]
members = [
    "crates/panda-asyncapi",
    "crates/panda-cli",
    "crates/panda-compiler",
    "crates/panda-core",
    "crates/panda-dsl",
    "crates/panda-mcp",
    "crates/panda-mock",
    "crates/panda-openapi",
    "crates/panda-runtime",
    "crates/panda-schema",
    "crates/panda-source",
    "crates/panda-test",
    "crates/panda-workspace",
]
exclude = ["compatibility/panda-0.7"]
resolver = "3"

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/arlicle/panda-api"
